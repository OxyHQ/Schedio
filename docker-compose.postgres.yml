services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: schedio
      POSTGRES_PASSWORD: schedio
      POSTGRES_DB: postgres
    ports:
      - "5441:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schedio -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 20
