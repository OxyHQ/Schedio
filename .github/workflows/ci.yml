name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request supersedes the run still testing the old head,
# so that run is cancelled. Nothing else is ever cancelled or queued: a push to
# main gets a group of its own through the run id, since a shared group would
# still let a newer pending run replace an older pending one even with
# cancel-in-progress off.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which app a pull request touches, so a backend-only change does not pay for
  # the Expo web export and a frontend-only change does not pay for the backend
  # suite. Anything outside the two app directories (shared-types, bun.lock,
  # any package.json, scripts, this workflow) counts as both, so the backend
  # job's lockfile check still runs on every manifest change. Pushes to main
  # always run everything.
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.backend == 'true' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.manifests == 'true' }}
      frontend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.manifests == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            backend:
              - 'packages/backend/**'
            frontend:
              - 'packages/frontend/**'
            manifests:
              - '**/package.json'
            shared:
              - '**'
              - '!packages/backend/**'
              - '!packages/frontend/**'
              - '!docs/**'
              - '!**/*.md'

  backend:
    name: Backend build and tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: schedio
          POSTGRES_PASSWORD: schedio
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schedio -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://schedio:schedio@127.0.0.1:5432/postgres
      SOCIAL_TOKEN_ENCRYPTION_KEY: abababababababababababababababababababababababababababababababab
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Lockfile matches manifests
        run: |
          bun install
          git diff --exit-code -- bun.lock
      - run: bun run --filter @schedio/backend typecheck
      - run: bun run build:backend
      - run: bun run --filter @schedio/backend test
      - name: Migrations match the schema
        working-directory: packages/backend
        run: |
          bun run db:generate
          git diff --exit-code -- drizzle

  frontend:
    name: Frontend web export
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build:frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
