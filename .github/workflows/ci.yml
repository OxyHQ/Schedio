name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request supersedes the run still testing the old head,
# so that run is cancelled. Nothing else is ever cancelled or queued: a push to
# main gets a group of its own through the run id, since a shared group would
# still let a newer pending run replace an older pending one even with
# cancel-in-progress off.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which app a pull request touches, so a backend-only change does not pay for
  # the Expo web export and a frontend-only change does not pay for the backend
  # suite. Anything outside the two app directories (shared-types, bun.lock,
  # any package.json, scripts, this workflow) counts as both, so the backend
  # job's lockfile check still runs on every manifest change. Pushes to main
  # always run everything.
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.backend == 'true' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.manifests == 'true' }}
      frontend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.manifests == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            backend:
              - 'packages/backend/**'
            frontend:
              - 'packages/frontend/**'
            manifests:
              - '**/package.json'
            shared:
              - '**'
              - '!packages/backend/**'
              - '!packages/frontend/**'
              - '!docs/**'
              - '!**/*.md'

  # Biome checks formatting and lint across the whole repo; the frontend's
  # minimal ESLint config then runs the eslint-plugin-expo rules Biome has no
  # equivalent for. Cheap enough to run on every pull request and push.
  # --error-on-warnings keeps the warning count at zero: the recommended rules
  # that default to warn (unused imports, explicit any, ...) fail CI too.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - uses: oven-sh/setup-bun@v2
        with:
          # NOT a literal version: `packageManager` in package.json is the one
          # pin, and `check:bun-pin` holds the Dockerfile's literal
          # `FROM oven/bun:<ver>` to it.
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Biome
        run: bunx biome ci --error-on-warnings .
      # Translation keys follow ADR 0055: nested identifier segments under a
      # namespace, every locale shaped like English. Missing translations warn.
      - name: Translation keys (ADR 0055)
        run: bun run i18n:check
      # Fails on a required native peer of the installed @oxy.so/services the
      # frontend does not declare (expo-crypto is its CSPRNG: without it sign-in
      # breaks on a native build) and on two copies of a package bun.lock could
      # serve with one.
      - name: Oxy dependency health (oxy-doctor)
        run: bun run doctor:oxy
      - name: Expo ESLint rules
        run: bun run --filter @schedio/frontend lint:expo
      # The backend image runs the bun its Dockerfile names, and that literal
      # cannot read package.json; this fails when the two disagree.
      - name: Bun pin matches the image
        run: bun run check:bun-pin

  # The Seldon race (OxyHQ/oxy docs/engineering/build-and-deploy.md, CI on
  # Seldon), opt-in with the repository variable CI_SELDON_RACE=true, on
  # same-repository pull requests (and merge_group runs, should this workflow
  # ever take them) only. Push runs stay hosted: the deploys follow a push run
  # on main that concluded `success`, and a race loser makes a run `cancelled`.
  # Unset, every job runs hosted as before and none of these takes a runner.
  # Set, Backend build and tests and Frontend web export run on the
  # self-hosted seldon-ci pool; a lane still queued 3 minutes after it was
  # created gets its hosted twin (the `-hosted` jobs), the lane that starts
  # first wins and the finish job cancels the other through its job-level
  # concurrency group. A Seldon lane that fails, whatever the reason (the house
  # network drops new connections in bursts), reruns hosted in its `-rescue`
  # job, which fails again on a genuine failure. CI complete takes the raced
  # jobs' verdict from the race. One wave: both raced jobs need `changes`, so
  # the start job waits for it and then sees every lane.
  race:
    needs: changes
    if: ${{ !cancelled() && vars.CI_SELDON_RACE == 'true' && github.run_attempt == 1 && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && !github.event.pull_request.head.repo.fork }}
    uses: OxyHQ/oxy/.github/workflows/seldon-race-start.yml@main
    permissions:
      actions: read

  race-finish:
    needs: race
    # `!cancelled()`: an ancestor skipped on this event must not skip it.
    if: ${{ !cancelled() && needs.race.outputs.race == 'true' }}
    uses: OxyHQ/oxy/.github/workflows/seldon-race-finish.yml@main
    permissions:
      actions: read

  backend:
    name: Backend build and tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: &seldon-lane ${{ vars.CI_SELDON_RACE == 'true' && github.run_attempt == 1 && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && !github.event.pull_request.head.repo.fork && 'seldon-ci' || 'ubuntu-latest' }}
    concurrency:
      group: seldon-race-${{ github.run_id }}-${{ github.run_attempt }}-seldon-Backend build and tests
    permissions: &race-lane-permissions
      contents: read
      actions: read # the Seldon race guard reads this run's jobs
    # About a minute on a good run.
    timeout-minutes: 20
    services: &backend-services
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: schedio
          POSTGRES_PASSWORD: schedio
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schedio -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env: &backend-env
      TEST_DATABASE_URL: postgres://schedio:schedio@127.0.0.1:5432/postgres
      SOCIAL_TOKEN_ENCRYPTION_KEY: abababababababababababababababababababababababababababababababab
    steps: &backend-steps
      # A lane that starts after its hosted twin waits here to be cancelled (the Seldon race).
      - &race-guard
        name: Seldon race guard
        if: vars.CI_SELDON_RACE == 'true' && !endsWith(github.job, '-rescue')
        uses: OxyHQ/oxy/.github/actions/seldon-race@main
        with:
          mode: guard
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - uses: oven-sh/setup-bun@v2
        with:
          # NOT a literal version: `packageManager` in package.json is the one
          # pin, and `check:bun-pin` holds the Dockerfile's literal
          # `FROM oven/bun:<ver>` to it.
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Lockfile matches manifests
        run: |
          bun install
          git diff --exit-code -- bun.lock
      - run: bun run --filter @schedio/backend typecheck
      - run: bun run check:publishing-artifacts
      - run: bun run check:openapi
      - run: bun run build:backend
      - run: bun run --filter @schedio/backend test
      - name: Migrations match the schema
        working-directory: packages/backend
        run: |
          bun run db:generate
          git diff --exit-code -- drizzle
      # Every Oxy app shares one Postgres: a new migration may not hold a lock
      # that stalls a hot table (NOT VALID constraints validated later, hot-table
      # DDL alone in its migration). The rules are @oxy.so/db's; the baseline and
      # hot tables are in packages/backend's db:check-locks script.
      - name: Every new migration keeps its locks short
        run: bun run --cwd packages/backend db:check-locks

  # backend's hosted twin in the Seldon race: the same name, services, env and steps.
  backend-hosted:
    name: ${{ vars.CI_SELDON_RACE == 'true' && 'Backend build and tests' || 'Backend build and tests (seldon twin, off)' }}
    needs: [changes, race]
    if: ${{ !cancelled() && needs.race.outputs.race == 'true' && needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: seldon-race-${{ github.run_id }}-${{ github.run_attempt }}-hosted-Backend build and tests
    permissions: *race-lane-permissions
    timeout-minutes: 20
    services: *backend-services
    env: *backend-env
    steps: *backend-steps

  # backend's rescue: reruns it hosted when its Seldon lane failed (the house
  # network drops connections); a genuine failure fails again.
  backend-rescue:
    name: ${{ vars.CI_SELDON_RACE == 'true' && 'Backend build and tests' || 'Backend build and tests (seldon rescue, off)' }}
    needs: [changes, backend]
    if: ${{ !cancelled() && needs.backend.result == 'failure' && vars.CI_SELDON_RACE == 'true' && github.run_attempt == 1 && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && !github.event.pull_request.head.repo.fork && needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    permissions: *race-lane-permissions
    timeout-minutes: 20
    services: *backend-services
    env: *backend-env
    steps: *backend-steps

  frontend:
    name: Frontend web export
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: *seldon-lane
    concurrency:
      group: seldon-race-${{ github.run_id }}-${{ github.run_attempt }}-seldon-Frontend web export
    permissions: *race-lane-permissions
    # Two to three minutes on a good run; the Expo web export is most of it.
    timeout-minutes: 20
    steps: &frontend-steps
      - *race-guard
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - uses: oven-sh/setup-bun@v2
        with:
          # NOT a literal version: `packageManager` in package.json is the one
          # pin, and `check:bun-pin` holds the Dockerfile's literal
          # `FROM oven/bun:<ver>` to it.
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run --filter @schedio/frontend test
      - run: bun run build:frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  # frontend's hosted twin in the Seldon race: the same name and steps.
  frontend-hosted:
    name: ${{ vars.CI_SELDON_RACE == 'true' && 'Frontend web export' || 'Frontend web export (seldon twin, off)' }}
    needs: [changes, race]
    if: ${{ !cancelled() && needs.race.outputs.race == 'true' && needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: seldon-race-${{ github.run_id }}-${{ github.run_attempt }}-hosted-Frontend web export
    permissions: *race-lane-permissions
    timeout-minutes: 20
    steps: *frontend-steps

  # frontend's rescue: reruns it hosted when its Seldon lane failed (the house
  # network drops connections); a genuine failure fails again.
  frontend-rescue:
    name: ${{ vars.CI_SELDON_RACE == 'true' && 'Frontend web export' || 'Frontend web export (seldon rescue, off)' }}
    needs: [changes, frontend]
    if: ${{ !cancelled() && needs.frontend.result == 'failure' && vars.CI_SELDON_RACE == 'true' && github.run_attempt == 1 && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && !github.event.pull_request.head.repo.fork && needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    permissions: *race-lane-permissions
    timeout-minutes: 20
    steps: *frontend-steps

  # The one check this workflow stands for, modelled on OxyHQ/Bloom's and
  # OxyHQ/Gemies': green only when every job above passed or skipped for a
  # reason this workflow declares, so a cancelled or unexplained-skipped job can
  # never read as a pass. Required checks by job name cannot follow the Seldon
  # race (a twin and a rescue share their job's name, and a cancelled loser is
  # not a failure); this one can.
  #
  # The skips it allows, and nothing else:
  #   - Backend build and tests and Frontend web export skip when `changes`
  #     said their app did not change (outside a pull request it always says
  #     yes).
  #   - The race's jobs, twins and rescues skip whenever they are not needed.
  # When the race or a rescue ran, a raced job passes on the race's verdict:
  # each of its names passed in some lane and failed in no hosted lane.
  # Not race-finish: its reapers run on seldon-ci-light and only follow the
  # cancellation, so needing it would wait on Seldon.
  ci-complete:
    name: CI complete
    if: always()
    needs:
      - changes
      - race
      - lint
      - backend
      - backend-hosted
      - backend-rescue
      - frontend
      - frontend-hosted
      - frontend-rescue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # the Seldon race verdict reads this run's jobs
    steps:
      # Per job name: passed when one of its lanes succeeded and no hosted lane
      # failed. Whenever the race is on: a rescue can run without the race.
      - name: Seldon race verdict
        id: race
        if: vars.CI_SELDON_RACE == 'true'
        uses: OxyHQ/oxy/.github/actions/seldon-race@main
        with:
          mode: verdict
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
          RACE_VERDICT: ${{ steps.race.outputs.outcome }}
        run: |
          set -euo pipefail
          failures=()
          result() { jq -r --arg job "$1" '.[$job].result // "missing"' <<<"$RESULTS"; }
          said() { jq -r --arg out "$1" '.changes.outputs[$out] // ""' <<<"$RESULTS"; }

          changes="$(result changes)"
          [ "$changes" = success ] || failures+=("changes did not pass: $changes")
          lint="$(result lint)"
          [ "$lint" = success ] || failures+=("lint did not pass: $lint")

          # The race's start: skipped when not needed, never failed.
          r="$(result race)"
          case "$r" in
            success | skipped) ;;
            *) failures+=("race did not pass: $r") ;;
          esac
          raced="$(jq -r '.race.outputs.race // ""' <<<"$RESULTS")"

          # A raced family's result, in $family: the verdict when the race ran
          # (and the job was not skipped) or its rescue ran; otherwise the
          # job's own, with its twin and rescue skipped. Not called in a
          # subshell, so its failures reach the list.
          family() {
            local job="$1" own twin rescue
            own="$(result "$job")"
            twin="$(result "$job-hosted")"
            rescue="$(result "$job-rescue")"
            if [ "$rescue" != skipped ] || { [ "$raced" = true ] && ! { [ "$own" = skipped ] && [ "$twin" = skipped ]; }; }; then
              family="${RACE_VERDICT:-no verdict}"
              return
            fi
            [ "$twin" = skipped ] || failures+=("$job-hosted ran although the Seldon race did not: $twin")
            family="$own"
          }

          # job, its `changes` output, its result.
          check() {
            local job="$1" filter="$2" r="$3"
            [ "$r" = success ] && return
            if [ "$r" = skipped ] && [ "$changes" = success ] && [ "$(said "$filter")" != true ]; then
              return
            fi
            failures+=("$job did not pass: $r")
          }
          family backend
          check backend backend "$family"
          family frontend
          check frontend frontend "$family"

          if [ ${#failures[@]} -gt 0 ]; then
            for failure in "${failures[@]}"; do
              echo "::error::$failure"
            done
            exit 1
          fi
          echo 'Every job passed, or skipped for a reason this workflow declares.'
