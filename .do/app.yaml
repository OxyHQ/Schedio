name: schedio
region: nyc

# Backend Service
services:
  - name: backend
    github:
      repo: OxyHQ/Schedio
      branch: main
      deploy_on_push: true

    dockerfile_path: packages/backend/Dockerfile

    # Environment
    http_port: 8080

    # Instance size
    instance_size_slug: basic-xxs
    instance_count: 1

    # Health check
    health_check:
      http_path: /api/health
      initial_delay_seconds: 30
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3

    # Environment variables (add these in DO dashboard)
    envs:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        value: ${schedio-db.DATABASE_URL}

# Frontend Static Site
static_sites:
  - name: frontend
    github:
      repo: OxyHQ/Schedio
      branch: main
      deploy_on_push: true

    # Build settings
    build_command: bun install --frozen-lockfile && bun run build:frontend
    output_dir: packages/frontend/dist

    # Environment variables for build
    envs:
      - key: EXPO_PUBLIC_API_URL
        value: ${backend.PUBLIC_URL}

# PostgreSQL database. A cutover operator must create and backfill this resource
# before switching the service; this spec is not an authorization to deploy it.
databases:
  - name: schedio-db
    engine: PG
    version: "17"
    production: true
    cluster_name: schedio-cluster
