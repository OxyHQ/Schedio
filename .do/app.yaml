name: schedio
region: nyc

# Backend Service
services:
  - name: backend
    github:
      repo: OxyHQ/Schedio
      branch: main
      deploy_on_push: true

    dockerfile_path: packages/backend/Dockerfile

    # Environment
    http_port: 8080

    # Instance size
    instance_size_slug: basic-xxs
    instance_count: 1

    # Health check
    health_check:
      http_path: /api/health
      initial_delay_seconds: 30
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3

    # Environment variables (add these in DO dashboard)
    envs:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      # Deliberately has no checked-in value. Before proposing the rendered
      # production spec, inject a 64-hex value and let App Platform return its
      # encrypted EV[...] form for every subsequent update.
      - key: SOCIAL_TOKEN_ENCRYPTION_KEY
        scope: RUN_TIME
        type: SECRET

# Frontend Static Site
static_sites:
  - name: frontend
    github:
      repo: OxyHQ/Schedio
      branch: main
      deploy_on_push: true

    # Build settings
    build_command: bun install --frozen-lockfile && bun run build:frontend
    output_dir: packages/frontend/dist

    # Environment variables for build
    envs:
      - key: EXPO_PUBLIC_API_URL
        value: ${backend.PUBLIC_URL}

# Database resources are deliberately absent from this checked-in template. The
# private rendered spec must bind DATABASE_URL to the exact, already provisioned
# and backfilled PostgreSQL component. Never reuse the legacy Mongo component's
# identity for an in-place engine change.
